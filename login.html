<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Sweet Batch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="logo">sweet batch</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to order and track your bakes.</p>

    <div id="loginMsg" class="form-msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-block" id="loginBtn">Log in</button>
    </form>

    <div class="auth-switch">New here? <a href="register.html">Create an account</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="ui.js"></script>
<script src="auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const msgEl = document.getElementById("loginMsg");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Logging in...";

    try {
      const { data, error } = await loginUser(email, password);

      if (error) {
        showFormMessage(msgEl, error.message, "error");
        return;
      }

      // route admin straight to the dashboard, everyone else to the menu
      const { data: profile } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();

      window.location.href = profile?.role === "admin" ? "admin.html" : "index.html";
    } finally {
      btn.disabled = false;
      btn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
