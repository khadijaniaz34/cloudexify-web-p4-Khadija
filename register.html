<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Sweet Batch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="logo">sweet batch</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">Sign up to start ordering fresh bakes.</p>

    <div id="registerMsg" class="form-msg"></div>

    <form id="registerForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn btn-block" id="registerBtn">Create account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="ui.js"></script>
<script src="auth.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("registerBtn");
    const msgEl = document.getElementById("registerMsg");
    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      const { error } = await registerUser(fullName, email, password);

      if (error) {
        showFormMessage(msgEl, error.message, "error");
        return;
      }

      showFormMessage(msgEl, "Account created! Redirecting to the menu...", "success");
      setTimeout(() => (window.location.href = "index.html"), 1200);
    } finally {
      btn.disabled = false;
      btn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
